shared:
  provider: openai_compatible
  model: replace-with-shared-model
  base_url: https://api.example.com/v1
  api_key_env: SHORTCUTMINER_OPENAI_API_KEY
  timeout: 60.0
  temperature: 0.0
  max_tokens: 4096
  retry_policy:
    max_attempts: 3
    initial_backoff_seconds: 0.5
    backoff_multiplier: 2.0
    max_backoff_seconds: 8.0
  model_call_budget:
    max_total_calls: 100
    max_calls_per_agent: 25
    max_schema_retries: 1
    max_transport_retries: 2
per_agent:
  identify:
    provider: openai_compatible
    model: replace-with-identify-model
    base_url: https://api.example.com/v1
    api_key_env: SHORTCUTMINER_OPENAI_API_KEY
    timeout: 60.0
    temperature: 0.0
    max_tokens: 4096
