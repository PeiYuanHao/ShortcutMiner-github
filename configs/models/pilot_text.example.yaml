provider: openai_compatible
model: deepseek-v4-flash
base_url: https://api.deepseek.com
api_key_env: "SHORTCUTMINER_TEXT_API_KEY"
temperature: 0.0
max_tokens: 8192
reasoning:
  mode: enabled
  effort: high
capabilities:
  supports_text: true
  supports_image_input: false
  supports_json_object: true
  supports_model_seed: false
  supports_reasoning_config: true
model_call_budget:
  max_total_calls: 200
  max_calls_per_agent: 40
  max_schema_retries: 1
  max_transport_retries: 2
