[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcutminer"
version = "0.1.0"
description = "A multi-agent framework for dataset shortcut discovery and auditing."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.1,<4",
    "pydantic>=2.0,<3",
    "pandas>=2.0,<4",
    "numpy>=1.26,<3",
    "Pillow==12.3.0",
    "scipy>=1.16,<2",
    "scikit-learn>=1.7,<2",
    "PyYAML>=6.0,<7",
    "rich>=13,<15",
    "transformers==5.14.1",
]

[project.scripts]
shortcutminer = "shortcutminer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shortcutminer*",
    "tools*",
]
