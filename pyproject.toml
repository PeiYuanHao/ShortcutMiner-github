[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shortcutminer"
version = "0.1.0"
description = "A multi-agent framework for dataset shortcut discovery and auditing."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.0,<2",
    "pydantic>=2.0",
    "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "shortcutminer*",
    "tools*",
]
